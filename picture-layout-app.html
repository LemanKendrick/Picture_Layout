<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Picture Layout Planner</title>
<style>
  :root{
    --ink:#2b2b28;
    --paper:#f7f5f1;
    --panel:#ffffff;
    --line:#dedad2;
    --accent:#3d5a80;
    --accent-2:#c96a4d;
    --ref:#8a3fa8;
    --muted:#7a766d;
    --danger:#b3492f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI", system-ui, sans-serif;
    background:var(--paper);
    color:var(--ink);
    height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:10px 16px;
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
  }
  header h1{
    font-size:16px;
    margin:0;
    font-weight:600;
    letter-spacing:.2px;
    color:var(--accent);
    white-space:nowrap;
  }
  .field{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
  }
  .field label{color:var(--muted);}
  .field input[type=number]{
    width:64px;
    padding:4px 6px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:13px;
  }
  button{
    font-family:inherit;
    font-size:13px;
    padding:6px 12px;
    border-radius:5px;
    border:1px solid var(--line);
    background:var(--panel);
    cursor:pointer;
    color:var(--ink);
  }
  button.primary{
    background:var(--accent);
    color:white;
    border-color:var(--accent);
  }
  button.danger{
    color:var(--danger);
    border-color:#e6c9c0;
  }
  button:hover{filter:brightness(0.97);}
  .spacer{flex:1;}

  .layout{
    flex:1;
    display:flex;
    min-height:0;
  }
  aside{
    width:250px;
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:14px;
    overflow-y:auto;
    flex-shrink:0;
  }
  aside h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
    margin:0 0 10px 0;
  }
  .add-frame-form{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:10px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    margin-bottom:16px;
  }
  .add-frame-form input[type=text],
  .add-frame-form input[type=number]{
    padding:5px 7px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:13px;
    width:100%;
  }
  .row2{display:flex; gap:6px;}
  .row2 input{width:0; flex:1;}
  .add-frame-form input[type=color]{
    width:100%;
    height:28px;
    border:1px solid var(--line);
    border-radius:4px;
    padding:2px;
  }
  .color-pair{display:flex; gap:6px; align-items:center;}
  .color-pair input[type=color]{
    width:40px;
    height:28px;
    flex-shrink:0;
    border:1px solid var(--line);
    border-radius:4px;
    padding:2px;
  }
  .color-pair input[type=text]{
    flex:1;
    width:0;
    padding:5px 7px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:13px;
    font-family:monospace;
    text-transform:uppercase;
  }

  .lib-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px;
    border:1px solid var(--line);
    border-radius:6px;
    margin-bottom:8px;
    background:var(--panel);
    cursor:grab;
  }
  .lib-item:hover{border-color:var(--accent);}
  .lib-swatch{
    flex-shrink:0;
    border:3px solid #8a8a86;
    background:#fff;
  }
  .lib-info{flex:1; font-size:12.5px; line-height:1.4;}
  .lib-info .name{font-weight:600;}
  .lib-info .dims{color:var(--muted);}
  .lib-del{
    border:none;
    background:none;
    color:var(--muted);
    cursor:pointer;
    font-size:15px;
    padding:2px 4px;
  }
  .lib-del:hover{color:var(--danger);}

  .canvas-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:auto;
    padding:24px;
    position:relative;
  }
  #space{
    position:relative;
    background-color:#ffffff;
    background-image: repeating-linear-gradient(
        0deg, rgba(0,0,0,0.035) 0, rgba(0,0,0,0.035) 1px, transparent 1px, transparent 24px),
      repeating-linear-gradient(
        90deg, rgba(0,0,0,0.035) 0, rgba(0,0,0,0.035) 1px, transparent 1px, transparent 24px);
    box-shadow:0 4px 18px rgba(0,0,0,0.12);
    border:1px solid #cfcac0;
    flex-shrink:0;
  }
  #space.dragover{outline:3px dashed var(--accent); outline-offset:2px;}

  .placed{
    position:absolute;
    border:6px solid #8a7a63;
    box-sizing:border-box;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
    cursor:move;
    overflow:hidden;
    user-select:none;
  }
  .mat-layer{
    width:100%;
    height:100%;
    box-sizing:border-box;
    display:flex;
    align-items:stretch;
    justify-content:stretch;
  }
  .image-layer{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    background-size:cover;
    background-position:center;
    background-color:#f2f0ec;
    color:#9c9488;
    font-size:11px;
    text-align:center;
    white-space:pre-line;
    overflow:hidden;
  }
  .placed.selected{outline:2px solid var(--accent); outline-offset:2px;}
  .placed.locked{outline:2px dashed var(--muted); outline-offset:2px; cursor:default;}
  .placed .close-btn{
    position:absolute;
    top:2px; right:2px;
    width:16px; height:16px;
    line-height:16px;
    text-align:center;
    background:rgba(0,0,0,0.55);
    color:#fff;
    border-radius:50%;
    font-size:11px;
    cursor:pointer;
    display:none;
    z-index:2;
  }
  .placed:hover .close-btn, .placed.selected .close-btn{display:block;}
  .placed .lock-btn{
    position:absolute;
    top:2px; left:2px;
    width:18px; height:18px;
    line-height:18px;
    text-align:center;
    background:rgba(0,0,0,0.55);
    color:#fff;
    border-radius:50%;
    font-size:10px;
    cursor:pointer;
    z-index:2;
    opacity:0;
  }
  .placed:hover .lock-btn, .placed.selected .lock-btn, .placed.locked .lock-btn{opacity:1;}
  .placed.locked .lock-btn{background:rgba(122,118,109,0.85);}
  .placed .num-badge{
    position:absolute;
    top:2px; left:50%;
    transform:translateX(-50%);
    min-width:18px;
    height:18px;
    line-height:18px;
    padding:0 4px;
    text-align:center;
    background:rgba(0,0,0,0.65);
    color:#fff;
    border-radius:9px;
    font-size:11px;
    font-weight:700;
    z-index:3;
    pointer-events:none;
  }
  .placed.dragover-img{outline:2px dashed var(--accent-2);}

  .gap-line{
    position:absolute;
    pointer-events:none;
    border-color:var(--accent-2);
  }
  .gap-line.horiz{
    height:0;
    border-top:1.5px dashed var(--accent-2);
  }
  .gap-line.vert{
    width:0;
    border-left:1.5px dashed var(--accent-2);
  }
  .gap-label{
    position:absolute;
    pointer-events:none;
    background:var(--paper);
    color:var(--accent-2);
    font-size:10.5px;
    font-weight:600;
    padding:1px 4px;
    border-radius:3px;
    border:1px solid var(--accent-2);
    white-space:nowrap;
    transform:translate(-50%,-50%);
  }
  .gap-line.top-dist{border-color:var(--accent);}
  .gap-label.top-dist{color:var(--accent); border-color:var(--accent);}

  .align-guide{
    position:absolute;
    pointer-events:none;
    z-index:5;
  }
  .align-guide.vert{width:0; border-left:1.5px solid var(--ref);}
  .align-guide.horiz{height:0; border-top:1.5px solid var(--ref);}

  .center-guide{
    position:absolute;
    width:0;
    top:0;
    border-left:1.5px dashed #a3a099;
    pointer-events:none;
  }

  .empty-msg{
    color:var(--muted);
    font-size:13px;
    text-align:center;
    max-width:220px;
  }

  #setupScreen{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .setup-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:32px 36px;
    box-shadow:0 4px 18px rgba(0,0,0,0.08);
    text-align:center;
    max-width:360px;
  }
  .setup-card h2{margin-top:0; color:var(--accent); font-size:18px;}
  .setup-card .row2{margin:18px 0;}
  .setup-card input{
    padding:8px;
    border:1px solid var(--line);
    border-radius:5px;
    font-size:14px;
  }
  .hint{font-size:12px; color:var(--muted); margin-top:4px;}
  #fileLoadInput{display:none;}
  .nudge-wrap{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:6px;
    position:fixed;
    right:24px;
    bottom:24px;
    z-index:50;
  }
  .nudge-wrap.visible{display:flex;}
  .turbo-toggle{
    display:flex;
    align-items:center;
    gap:5px;
    background:rgba(255,255,255,0.92);
    border:1px solid var(--line);
    border-radius:8px;
    padding:4px 10px;
    font-size:12px;
    font-weight:600;
    color:var(--ink);
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
    cursor:pointer;
    user-select:none;
  }
  .nudge-pad{
    display:grid;
    grid-template-columns:44px 44px 44px;
    grid-template-rows:44px 44px 44px;
    gap:2px;
    background:rgba(255,255,255,0.92);
    border:1px solid var(--line);
    border-radius:14px;
    padding:8px;
    box-shadow:0 4px 16px rgba(0,0,0,0.18);
  }
  .nudge-btn{
    grid-column:2;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .nudge-btn:hover{filter:brightness(1.1);}
  .nudge-btn:disabled{background:#bcbcbc; cursor:not-allowed;}
  .nudge-up{grid-row:1;}
  .nudge-down{grid-row:3;}
  .nudge-left{grid-row:2; grid-column:1;}
  .nudge-right{grid-row:2; grid-column:3;}
  .nudge-center{
    grid-row:2; grid-column:2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:700;
    color:var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>Picture Layout Planner</h1>
  <div id="spaceInfo" class="field" style="display:none;">
    <label>Space:</label>
    <span id="spaceInfoText" style="font-weight:600;"></span>
    <button id="resizeSpaceBtn">Change size</button>
  </div>
  <label class="field" id="gapToggleWrap" style="display:none;">
    <input type="checkbox" id="showGapsToggle" checked>
    <span>Show spacing</span>
  </label>
  <label class="field" id="topDistToggleWrap" style="display:none;">
    <input type="checkbox" id="showTopDistToggle" checked>
    <span>Top left corner</span>
  </label>
  <div class="field" id="bgColorWrap" style="display:none; gap:4px;">
    <label>Canvas background</label>
    <input type="color" id="canvasBgColor" value="#ffffff" style="width:32px;height:26px;padding:1px;">
    <input type="text" id="canvasBgColorHex" value="#ffffff" maxlength="7" placeholder="#RRGGBB" style="width:80px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-size:12px;font-family:monospace;text-transform:uppercase;">
  </div>
  <div class="field" id="undoRedoWrap" style="display:none; gap:4px;">
    <button id="undoBtn" title="Undo (Ctrl+Z)">&#8630; Undo</button>
    <button id="redoBtn" title="Redo (Ctrl+Y)">&#8631; Redo</button>
  </div>
  <div class="spacer"></div>
  <button id="exportPdfBtn" style="display:none;">Export PDF</button>
  <button id="exportCsvBtn" style="display:none;">Export data (CSV)</button>
  <button id="saveProjectBtn" style="display:none;">Save layout</button>
  <button id="loadProjectBtn">Load layout</button>
  <input type="file" id="fileLoadInput" accept="application/json">
  <button id="clearCanvasBtn" class="danger" style="display:none;">Clear canvas</button>
</header>

<div class="layout">
  <aside>
    <h2>Frame Library</h2>
    <div class="add-frame-form">
      <input type="text" id="newFrameName" placeholder="Frame name (e.g. 8x10)">
      <label class="hint" style="margin:2px 0 0;">Overall outer dimensions</label>
      <div class="row2">
        <input type="number" id="newFrameW" placeholder="Overall width in" min="0.1" step="0.1">
        <input type="number" id="newFrameH" placeholder="Overall height in" min="0.1" step="0.1">
      </div>
      <label class="hint" style="margin:6px 0 0;">Frame member width (molding width)</label>
      <input type="number" id="newFrameMemberW" placeholder="e.g. 1.5" min="0.125" step="0.125" value="1.5">
      <label class="hint" style="margin:6px 0 0;">Frame color</label>
      <div class="color-pair">
        <input type="color" id="newFrameColor" value="#8a7a63">
        <input type="text" id="newFrameColorHex" value="#8a7a63" maxlength="7" placeholder="#RRGGBB">
      </div>
      <label class="hint" style="margin:6px 0 0;">Mat (optional)</label>
      <input type="number" id="newFrameMatW" placeholder="Mat width in" min="0" step="0.125">
      <div class="color-pair" style="margin-top:6px;">
        <input type="color" id="newFrameMatColor" value="#ffffff" title="Mat color">
        <input type="text" id="newFrameMatColorHex" value="#ffffff" maxlength="7" placeholder="#RRGGBB">
      </div>
      <button class="primary" id="addFrameBtn" style="margin-top:10px;">Add to library</button>
    </div>
    <h2>Your Frames</h2>
    <div id="libraryList"></div>
  </aside>

  <div class="canvas-wrap" id="canvasWrap">
    <div id="setupScreen">
      <div class="setup-card">
        <h2>Set up your space</h2>
        <p style="font-size:13px;color:var(--muted);">Enter the width and height of the wall or area you're planning, in inches.</p>
        <div class="row2">
          <input type="number" id="spaceW" placeholder="Width" min="1" step="0.5">
          <input type="number" id="spaceH" placeholder="Height" min="1" step="0.5">
        </div>
        <button class="primary" id="createSpaceBtn">Create space</button>
        <div class="hint">You can change this later.</div>
      </div>
    </div>
    <div id="space" style="display:none;"></div>
  </div>
</div>

<div id="nudgeWrap" class="nudge-wrap">
  <label class="turbo-toggle" for="turboCheck">
    <input type="checkbox" id="turboCheck">
    <span>Turbo</span>
  </label>
  <div id="nudgePad" class="nudge-pad">
    <button class="nudge-btn nudge-up" id="nudgeUp" title="Nudge up">&#9650;</button>
    <button class="nudge-btn nudge-left" id="nudgeLeft" title="Nudge left">&#9664;</button>
    <div class="nudge-center" id="nudgeAmountLabel">1/8&quot;</div>
    <button class="nudge-btn nudge-right" id="nudgeRight" title="Nudge right">&#9654;</button>
    <button class="nudge-btn nudge-down" id="nudgeDown" title="Nudge down">&#9660;</button>
  </div>
</div>

<script src="libs/jspdf.umd.min.js"></script>
<script src="libs/jspdf.plugin.autotable.min.js"></script>
<script>
(function(){
  const LS_LIBRARY = "pla_library_v1";
  const LS_PROJECT = "pla_project_v1";

  let library = JSON.parse(localStorage.getItem(LS_LIBRARY) || "[]");
  let space = null;          // {w,h}
  let placed = [];           // {id, name, w, h, color, x, y, img}
  let pxPerInch = 40;
  let selectedId = null;
  let dragState = null;      // for moving a placed frame
  let showGaps = true;
  let showTopDist = true;
  let canvasBgColor = "#ffffff";
  let undoStack = [];
  let redoStack = [];
  const ALIGN_SNAP_PX = 6;
  const NUDGE_INCHES = 0.125; // 1/8"

  const el = (id) => document.getElementById(id);

  function snapshotPlaced(){
    return JSON.parse(JSON.stringify(placed));
  }
  function pushUndo(){
    undoStack.push(snapshotPlaced());
    if(undoStack.length > 50) undoStack.shift();
    redoStack = [];
    updateUndoRedoButtons();
  }
  function updateUndoRedoButtons(){
    el("undoBtn").disabled = undoStack.length === 0;
    el("redoBtn").disabled = redoStack.length === 0;
  }

  function undo(){
    if(undoStack.length === 0) return;
    redoStack.push(snapshotPlaced());
    placed = undoStack.pop();
    selectedId = null;
    updateUndoRedoButtons();
    renderPlaced();
    saveProjectState();
  }
  function redo(){
    if(redoStack.length === 0) return;
    undoStack.push(snapshotPlaced());
    placed = redoStack.pop();
    selectedId = null;
    updateUndoRedoButtons();
    renderPlaced();
    saveProjectState();
  }
  el("undoBtn").addEventListener("click", undo);
  el("redoBtn").addEventListener("click", redo);
  document.addEventListener("keydown", (e) => {
    const tag = document.activeElement.tagName;
    if(tag === "INPUT" || tag === "TEXTAREA") return;
    if((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z"){
      e.preventDefault(); undo();
    } else if((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === "y" || (e.shiftKey && e.key.toLowerCase() === "z"))){
      e.preventDefault(); redo();
    }
  });

  // ---------- Library ----------
  function saveLibrary(){
    localStorage.setItem(LS_LIBRARY, JSON.stringify(library));
  }

  function renderLibrary(){
    const list = el("libraryList");
    list.innerHTML = "";
    if(library.length === 0){
      list.innerHTML = '<div class="hint">No frames yet. Add sizes above — they\'ll be saved for next time.</div>';
      return;
    }
    library.forEach(f => {
      const item = document.createElement("div");
      item.className = "lib-item";
      item.draggable = true;
      item.dataset.id = f.id;

      const maxSwatch = 34;
      const ratio = f.w / f.h;
      let sw, sh;
      if(ratio > 1){ sw = maxSwatch; sh = maxSwatch/ratio; }
      else { sh = maxSwatch; sw = maxSwatch*ratio; }
      const matW = f.matWidth || 0;
      const matColor = f.matColor || "#ffffff";
      const scale = sw / f.w;
      const matPx = matW > 0 ? Math.max(1, Math.round(matW * scale)) : 0;
      const matShadow = matPx > 0 ? `box-shadow:inset 0 0 0 ${matPx}px ${matColor};` : "";
      const memberWidth = f.memberWidth || 1.5;
      const memberPx = Math.max(1, Math.round(memberWidth * scale));

      const matLine = matW > 0 ? `${matW}" mat` : "no mat";

      item.innerHTML = `
        <div class="lib-swatch" style="width:${sw}px;height:${sh}px;border-width:${memberPx}px;border-color:${f.color};${matShadow}"></div>
        <div class="lib-info">
          <div class="name">${escapeHtml(f.name)}</div>
          <div class="dims">${f.w}" x ${f.h}" &middot; ${memberWidth}" molding &middot; ${matLine}</div>
        </div>
        <button class="lib-del" title="Remove from library">&times;</button>
      `;
      item.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", "lib:" + f.id);
        e.dataTransfer.effectAllowed = "copy";
      });
      item.querySelector(".lib-del").addEventListener("click", (e) => {
        e.stopPropagation();
        library = library.filter(x => x.id !== f.id);
        saveLibrary();
        renderLibrary();
      });
      list.appendChild(item);
    });
  }

  function normalizeHex(hex){
    hex = (hex || "").trim();
    if(!hex.startsWith("#")) hex = "#" + hex;
    const m3 = /^#([0-9A-Fa-f]{3})$/.exec(hex);
    if(m3){
      const [r,g,b] = m3[1].split("");
      return ("#" + r+r+g+g+b+b).toLowerCase();
    }
    const m6 = /^#([0-9A-Fa-f]{6})$/.exec(hex);
    if(m6) return hex.toLowerCase();
    return null;
  }

  function linkColorHexInputs(colorId, hexId){
    const colorInput = el(colorId);
    const hexInput = el(hexId);
    colorInput.addEventListener("input", () => {
      hexInput.value = colorInput.value;
    });
    hexInput.addEventListener("input", () => {
      const normalized = normalizeHex(hexInput.value);
      if(normalized) colorInput.value = normalized;
    });
    hexInput.addEventListener("blur", () => {
      const normalized = normalizeHex(hexInput.value);
      hexInput.value = normalized || colorInput.value;
    });
  }
  linkColorHexInputs("newFrameColor", "newFrameColorHex");
  linkColorHexInputs("newFrameMatColor", "newFrameMatColorHex");
  linkColorHexInputs("canvasBgColor", "canvasBgColorHex");

  function updateCanvasBgColor(newColor){
    canvasBgColor = newColor;
    applyCanvasBgColor();
    saveProjectState();
  }
  el("canvasBgColor").addEventListener("input", () => updateCanvasBgColor(el("canvasBgColor").value));
  el("canvasBgColorHex").addEventListener("input", () => {
    const normalized = normalizeHex(el("canvasBgColorHex").value);
    if(normalized) updateCanvasBgColor(normalized);
  });

  el("addFrameBtn").addEventListener("click", () => {
    const name = el("newFrameName").value.trim();
    const w = parseFloat(el("newFrameW").value);
    const h = parseFloat(el("newFrameH").value);
    const memberWidth = parseFloat(el("newFrameMemberW").value) || 1.5;
    const color = el("newFrameColor").value;
    const matWidth = parseFloat(el("newFrameMatW").value) || 0;
    const matColor = el("newFrameMatColor").value;
    if(!name || !w || !h){
      alert("Enter a name, width, and height for the frame.");
      return;
    }
    library.push({id: "f" + Date.now(), name, w, h, memberWidth, color, matWidth, matColor});
    saveLibrary();
    renderLibrary();
    el("newFrameName").value = "";
    el("newFrameW").value = "";
    el("newFrameH").value = "";
    el("newFrameMemberW").value = "1.5";

    el("newFrameColor").value = "#8a7a63";
    el("newFrameColorHex").value = "#8a7a63";

  el("createSpaceBtn").addEventListener("click", () => {

  function setupSpace(w, h){

    el("undoRedoWrap").style.display = "flex";
    undoStack = [];
    redoStack = [];

    saveProjectState();

  function applyCanvasBgColor(){
    el("space").style.backgroundColor = canvasBgColor;
  }

  // ---------- Placed frames ----------
  function renderCenterGuide(){
    if(!space) return;
    const spaceEl = el("space");
    const spaceWpx = space.w * pxPerInch;
    const spaceHpx = space.h * pxPerInch;
    const line = document.createElement("div");
    line.className = "center-guide";
    line.style.left = (spaceWpx / 2) + "px";
    line.style.height = spaceHpx + "px";
    spaceEl.appendChild(line);
  }

  function renderPlaced(){
    const spaceEl = el("space");
    spaceEl.querySelectorAll(".placed, .gap-line, .gap-label, .align-guide, .center-guide").forEach(n => n.remove());
    renderCenterGuide();
    placed.forEach((p, idx) => {
      const pictureNumber = idx + 1;
      const d = document.createElement("div");
      d.className = "placed"
        + (p.id === selectedId ? " selected" : "")
        + (p.locked ? " locked" : "");
      d.dataset.id = p.id;
      d.style.left = p.x + "px";
      d.style.top = p.y + "px";
      d.style.width = (p.w * pxPerInch) + "px";
      d.style.height = (p.h * pxPerInch) + "px";
      d.style.borderColor = p.color;
      d.style.borderWidth = ((p.memberWidth || 1.5) * pxPerInch) + "px";

      const matW = p.matWidth || 0;
      const matColor = p.matColor || "#ffffff";
      const matPx = matW * pxPerInch;

      const mat = document.createElement("div");
      mat.className = "mat-layer";
      mat.style.padding = matPx + "px";
      mat.style.background = matW > 0 ? matColor : "transparent";

      const img = document.createElement("div");
      img.className = "image-layer";
      if(p.img){
        img.style.backgroundImage = `url(${p.img})`;
      } else {
        img.textContent = `${p.name}\n${p.w}"x${p.h}"`;
      }
      mat.appendChild(img);
      d.appendChild(mat);
      d.innerHTML += '<div class="close-btn">&times;</div>';
      d.innerHTML += `<div class="lock-btn" title="${p.locked ? 'Unlock position' : 'Lock position'}">${p.locked ? '&#128274;' : '&#128275;'}</div>`;
      d.innerHTML += `<div class="num-badge">${pictureNumber}</div>`;

      d.addEventListener("mousedown", (e) => {
        if(e.target.classList.contains("close-btn") || e.target.classList.contains("lock-btn")) return;
        selectedId = p.id;
        renderPlaced();
        if(p.locked) return;
        dragState = {
          id: p.id,
          offsetX: e.clientX - p.x - spaceEl.getBoundingClientRect().left,
          offsetY: e.clientY - p.y - spaceEl.getBoundingClientRect().top,
          startX: p.x,
          startY: p.y,
          moved: false
        };
        e.preventDefault();
      });
      d.querySelector(".lock-btn").addEventListener("click", (e) => {
        e.stopPropagation();
        pushUndo();
        p.locked = !p.locked;
        renderPlaced();
        saveProjectState();
      });
      d.querySelector(".close-btn").addEventListener("click", (e) => {
        e.stopPropagation();
        pushUndo();
        placed = placed.filter(x => x.id !== p.id);
        if(selectedId === p.id) selectedId = null;
        renderPlaced();
        saveProjectState();
      });

      // image drop onto this frame
      d.addEventListener("dragover", (e) => {
        if(e.dataTransfer.types.includes("Files")){
          e.preventDefault();
          e.stopPropagation();
          d.classList.add("dragover-img");
        }
      });
      d.addEventListener("dragleave", () => d.classList.remove("dragover-img"));
      d.addEventListener("drop", (e) => {
        if(e.dataTransfer.files && e.dataTransfer.files.length > 0){
          e.preventDefault();
          e.stopPropagation();
          d.classList.remove("dragover-img");
          const file = e.dataTransfer.files[0];
          if(!file.type.startsWith("image/")) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            pushUndo();
            const item = placed.find(x => x.id === p.id);
            item.img = ev.target.result;
            renderPlaced();
            saveProjectState();
          };
          reader.readAsDataURL(file);
        }
      });

      spaceEl.appendChild(d);
    });

    if(showGaps) renderGaps();
    if(showTopDist) renderSelectedDistance();
    updateNudgePad();
  }

  function updateNudgePad(){
    const wrap = el("nudgeWrap");
    const item = placed.find(p => p.id === selectedId);
    if(!item){
      wrap.classList.remove("visible");
      return;
    }
    wrap.classList.add("visible");
    const disable = !!item.locked;
    ["nudgeUp","nudgeDown","nudgeLeft","nudgeRight"].forEach(id => {
      el(id).disabled = disable;
    });
  }

  function currentNudgeAmount(){
    return el("turboCheck").checked ? NUDGE_INCHES * 4 : NUDGE_INCHES;
  }

  function updateNudgeLabels(){
    const label = el("turboCheck").checked ? '1/2"' : '1/8"';
    el("nudgeAmountLabel").textContent = label;
    el("nudgeUp").title = "Nudge up " + label;
    el("nudgeDown").title = "Nudge down " + label;
    el("nudgeLeft").title = "Nudge left " + label;
    el("nudgeRight").title = "Nudge right " + label;
  }
  el("turboCheck").addEventListener("change", updateNudgeLabels);
  updateNudgeLabels();

  function nudgeSelected(dxIn, dyIn){
    const item = placed.find(p => p.id === selectedId);
    if(!item || item.locked) return;
    const spaceEl = el("space");
    const rect = spaceEl.getBoundingClientRect();
    const wpx = item.w * pxPerInch, hpx = item.h * pxPerInch;
    let x = item.x + dxIn * pxPerInch;
    let y = item.y + dyIn * pxPerInch;
    x = Math.max(0, Math.min(x, rect.width - wpx));
    y = Math.max(0, Math.min(y, rect.height - hpx));
    if(x === item.x && y === item.y) return;
    pushUndo();
    item.x = x;
    item.y = y;
    renderPlaced();
    saveProjectState();
  }

  el("nudgeUp").addEventListener("click", () => nudgeSelected(0, -currentNudgeAmount()));
  el("nudgeDown").addEventListener("click", () => nudgeSelected(0, currentNudgeAmount()));
  el("nudgeLeft").addEventListener("click", () => nudgeSelected(-currentNudgeAmount(), 0));
  el("nudgeRight").addEventListener("click", () => nudgeSelected(currentNudgeAmount(), 0));

  function gcd(a, b){ return b === 0 ? a : gcd(b, a % b); }

  function formatInches(value, denom){
    denom = denom || 8; // nearest 1/8"
    let whole = Math.floor(value + 1e-9);
    let frac = value - whole;
    let num = Math.round(frac * denom);
    if(num === denom){ whole += 1; num = 0; }
    if(num === 0) return whole + '"';
    const g = gcd(num, denom);
    const n = num / g, d = denom / g;
    return (whole > 0 ? whole + " " : "") + n + "/" + d + '"';
  }

  function drawGapLine(kind, x1, y1, x2, y2, inches, variant, labelPos){
    const spaceEl = el("space");
    const cls = variant ? (" " + variant) : "";
    const line = document.createElement("div");
    line.className = "gap-line" + cls + " " + kind;
    if(kind === "horiz"){
      line.style.left = x1 + "px";
      line.style.top = y1 + "px";
      line.style.width = (x2 - x1) + "px";
    } else {
      line.style.left = x1 + "px";
      line.style.top = y1 + "px";
      line.style.height = (y2 - y1) + "px";
    }
    spaceEl.appendChild(line);

    const label = document.createElement("div");
    label.className = "gap-label" + cls;
    label.textContent = formatInches(inches);
    const lx = labelPos ? labelPos.x : (x1 + x2) / 2;
    const ly = labelPos ? labelPos.y : (y1 + y2) / 2;
    label.style.left = lx + "px";
    label.style.top = ly + "px";
    spaceEl.appendChild(label);
  }

  function renderSelectedDistance(){
    if(!selectedId) return;
    const item = placed.find(p => p.id === selectedId);
    if(!item) return;
    const wpx = item.w * pxPerInch, hpx = item.h * pxPerInch;
    const xMid = item.x + wpx / 2;
    const yMid = item.y + hpx / 2;
    const yTop = item.y;
    const xLeft = item.x;

    // Anchor each label right next to the selected frame's own edge, rather than
    // at the line's midpoint — otherwise on multi-row/multi-column layouts the
    // label can land inside a frame the line merely passes through, looking
    // disconnected from the frame actually being measured.
    if(yTop >= 2){
      const labelY = Math.max(12, yTop - 14);
      drawGapLine("vert", xMid, 0, xMid, yTop, yTop / pxPerInch, "top-dist", {x: xMid, y: labelY});
    }

    if(xLeft >= 2){
      const labelX = Math.max(24, xLeft - 20);
      drawGapLine("horiz", 0, yMid, xLeft, yMid, xLeft / pxPerInch, "top-dist", {x: labelX, y: yMid});
    }
  }

  // ---------- Spacing (dashed gap lines) between adjacent frames ----------
  function renderGaps(){
    const OVERLAP_MIN = 4; // px of perpendicular overlap required to count as "adjacent"

    const boxes = placed.map(p => ({
      id: p.id, x1: p.x, y1: p.y, x2: p.x + p.w*pxPerInch, y2: p.y + p.h*pxPerInch
    }));

    // horizontal gaps (side-by-side frames) — nearest neighbor to the right per frame
    boxes.forEach(a => {
      let best = null;
      boxes.forEach(b => {
        if(b.id === a.id) return;
        const overlap = Math.min(a.y2,b.y2) - Math.max(a.y1,b.y1);
        if(overlap < OVERLAP_MIN) return;
        if(b.x1 < a.x2) return; // not to the right
        const gap = b.x1 - a.x2;
        if(gap < 0) return;
        if(!best || gap < best.gap) best = {b, gap, overlap};
      });
      if(best){
        const yTop = Math.max(a.y1, best.b.y1);
        const yBot = Math.min(a.y2, best.b.y2);
        const yMid = (yTop + yBot) / 2;
        drawGapLine("horiz", a.x2, yMid, best.b.x1, yMid, best.gap / pxPerInch);
      }
    });

    // vertical gaps (stacked frames) — nearest neighbor below per frame
    boxes.forEach(a => {
      let best = null;
      boxes.forEach(b => {
        if(b.id === a.id) return;
        const overlap = Math.min(a.x2,b.x2) - Math.max(a.x1,b.x1);
        if(overlap < OVERLAP_MIN) return;
        if(b.y1 < a.y2) return; // not below
        const gap = b.y1 - a.y2;
        if(gap < 0) return;
        if(!best || gap < best.gap) best = {b, gap, overlap};
      });
      if(best){
        const xLeft = Math.max(a.x1, best.b.x1);
        const xRight = Math.min(a.x2, best.b.x2);
        const xMid = (xLeft + xRight) / 2;
        drawGapLine("vert", xMid, a.y2, xMid, best.b.y1, best.gap / pxPerInch);
      }
    });
  }

  el("showGapsToggle").addEventListener("change", (e) => {
    showGaps = e.target.checked;
    renderPlaced();
  });

  el("showTopDistToggle").addEventListener("change", (e) => {
    showTopDist = e.target.checked;
    renderPlaced();
  });

  function computeAlignmentSnap(item, x, y, wpx, hpx){
    const others = placed.filter(p => p.id !== item.id);
    if(others.length === 0) return {x, y, vGuideX: null, hGuideY: null};

    const x1 = x, x2 = x + wpx, cx = (x1 + x2) / 2;
    const y1 = y, y2 = y + hpx, cy = (y1 + y2) / 2;

    let bestX = null; // {diff, rv, box}
    let bestY = null;

    others.forEach(o => {
      const ox1 = o.x, oy1 = o.y;
      const owpx = o.w * pxPerInch, ohpx = o.h * pxPerInch;
      const ox2 = ox1 + owpx, oy2 = oy1 + ohpx;
      const ocx = (ox1 + ox2) / 2, ocy = (oy1 + oy2) / 2;
      const box = {x1: ox1, y1: oy1, x2: ox2, y2: oy2};

      [[x1, ox1], [x1, ox2], [x2, ox1], [x2, ox2], [cx, ocx]].forEach(([mv, rv]) => {
        const diff = mv - rv;
        if(Math.abs(diff) <= ALIGN_SNAP_PX && (!bestX || Math.abs(diff) < Math.abs(bestX.diff))){
          bestX = {diff, rv, box};
        }
      });

      [[y1, oy1], [y1, oy2], [y2, oy1], [y2, oy2], [cy, ocy]].forEach(([mv, rv]) => {
        const diff = mv - rv;
        if(Math.abs(diff) <= ALIGN_SNAP_PX && (!bestY || Math.abs(diff) < Math.abs(bestY.diff))){
          bestY = {diff, rv, box};
        }
      });
    });

    let snappedX = x, snappedY = y, vGuideX = null, hGuideY = null, vBox = null, hBox = null;
    if(bestX){ snappedX = x - bestX.diff; vGuideX = bestX.rv; vBox = bestX.box; }
    if(bestY){ snappedY = y - bestY.diff; hGuideY = bestY.rv; hBox = bestY.box; }

    return {x: snappedX, y: snappedY, vGuideX, hGuideY, vBox, hBox};
  }

  function drawAlignGuides(item, wpx, hpx, snap){
    const spaceEl = el("space");
    if(snap.vGuideX !== null && snap.vBox){
      const yTop = Math.min(item.y, snap.vBox.y1);
      const yBot = Math.max(item.y + hpx, snap.vBox.y2);
      const line = document.createElement("div");
      line.className = "align-guide vert";
      line.style.left = snap.vGuideX + "px";
      line.style.top = yTop + "px";
      line.style.height = (yBot - yTop) + "px";
      spaceEl.appendChild(line);
    }
    if(snap.hGuideY !== null && snap.hBox){
      const xLeft = Math.min(item.x, snap.hBox.x1);
      const xRight = Math.max(item.x + wpx, snap.hBox.x2);
      const line = document.createElement("div");
      line.className = "align-guide horiz";
      line.style.left = xLeft + "px";
      line.style.top = snap.hGuideY + "px";
      line.style.width = (xRight - xLeft) + "px";
      spaceEl.appendChild(line);
    }
  }

  document.addEventListener("mousemove", (e) => {
    if(!dragState) return;
    const spaceEl = el("space");
    const rect = spaceEl.getBoundingClientRect();
    const item = placed.find(x => x.id === dragState.id);
    let x = e.clientX - rect.left - dragState.offsetX;
    let y = e.clientY - rect.top - dragState.offsetY;
    const wpx = item.w * pxPerInch, hpx = item.h * pxPerInch;
    x = Math.max(0, Math.min(x, rect.width - wpx));
    y = Math.max(0, Math.min(y, rect.height - hpx));

    const snap = computeAlignmentSnap(item, x, y, wpx, hpx);
    x = Math.max(0, Math.min(snap.x, rect.width - wpx));
    y = Math.max(0, Math.min(snap.y, rect.height - hpx));

    if(!dragState.moved && (x !== dragState.startX || y !== dragState.startY)){
      dragState.moved = true;
      dragState.beforeSnapshot = dragState.beforeSnapshot || snapshotPlacedExcept(item.id, dragState.startX, dragState.startY);
    }
    item.x = x; item.y = y;
    renderPlaced();
    drawAlignGuides(item, wpx, hpx, snap);
  });
  document.addEventListener("mouseup", () => {
    if(dragState){
      if(dragState.moved && dragState.beforeSnapshot){
        undoStack.push(dragState.beforeSnapshot);
        if(undoStack.length > 50) undoStack.shift();
        redoStack = [];
        updateUndoRedoButtons();
      }
      dragState = null;
      saveProjectState();
      document.querySelectorAll(".align-guide").forEach(n => n.remove());
    }
  });

  // Builds a pre-drag snapshot: same as current placed, but the dragged item's
  // position restored to where it was before this drag started.
  function snapshotPlacedExcept(id, origX, origY){
    return placed.map(p => p.id === id ? {...p, x: origX, y: origY} : {...p});
  }

  document.addEventListener("keydown", (e) => {
    if(e.key === "Delete" && selectedId){
      pushUndo();
      placed = placed.filter(x => x.id !== selectedId);
      selectedId = null;
      renderPlaced();
      saveProjectState();
    }
  });

  // dropping a library frame onto the space
  const spaceWrap = el("space");
  spaceWrap.addEventListener("click", (e) => {
    if(e.target === spaceWrap && selectedId){
      selectedId = null;
      renderPlaced();
    }
  });
  spaceWrap.addEventListener("dragover", (e) => {
    if(!e.dataTransfer.types.includes("Files")){
      e.preventDefault();
      spaceWrap.classList.add("dragover");
    }
  });
  spaceWrap.addEventListener("dragleave", () => spaceWrap.classList.remove("dragover"));
  spaceWrap.addEventListener("drop", (e) => {
    spaceWrap.classList.remove("dragover");
    const data = e.dataTransfer.getData("text/plain");
    if(!data || !data.startsWith("lib:")) return;
    e.preventDefault();
    const libId = data.slice(4);
    const f = library.find(x => x.id === libId);
    if(!f) return;
    const rect = spaceWrap.getBoundingClientRect();
    const wpx = f.w * pxPerInch, hpx = f.h * pxPerInch;
    let x = e.clientX - rect.left - wpx/2;
    let y = e.clientY - rect.top - hpx/2;
    x = Math.max(0, Math.min(x, rect.width - wpx));
    y = Math.max(0, Math.min(y, rect.height - hpx));
    pushUndo();
    placed.push({id: "p"+Date.now(), name: f.name, w: f.w, h: f.h, memberWidth: f.memberWidth || 1.5, color: f.color, matWidth: f.matWidth || 0, matColor: f.matColor || "#ffffff", x, y, img: null, locked: false});
    renderPlaced();
    saveProjectState();
  });

  el("clearCanvasBtn").addEventListener("click", () => {
    if(confirm("Remove all placed frames from the canvas?")){
      pushUndo();
      placed = [];
      selectedId = null;
      renderPlaced();
      saveProjectState();
    }
  });

  // ---------- Hanging data (for CSV export and PDF table) ----------
  function computeHangingRows(){
    return placed.map((p, idx) => {
      const topLeftX = p.x / pxPerInch;
      const topLeftY = p.y / pxPerInch;
      const topCenterX = topLeftX + p.w / 2;
      const topCenterY = topLeftY;
      return {
        number: idx + 1,
        spaceW: space.w,
        spaceH: space.h,
        frameW: p.w,
        frameH: p.h,
        topLeftX: round3(topLeftX),
        topLeftY: round3(topLeftY),
        topCenterX: round3(topCenterX),
        topCenterY: round3(topCenterY)
      };
    });
  }
  function round3(n){ return Math.round(n * 1000) / 1000; }

  const HANGING_HEADERS = [
    "Space Width (in)", "Space Height (in)", "Picture #",
    "Frame Width (in)", "Frame Height (in)",
    "Top-Left X (in)", "Top-Left Y (in)",
    "Top-Center X (in)", "Top-Center Y (in)"
  ];

  function hangingRowToArray(r){
    return [r.spaceW, r.spaceH, r.number, r.frameW, r.frameH, r.topLeftX, r.topLeftY, r.topCenterX, r.topCenterY];
  }

  el("exportCsvBtn").addEventListener("click", () => {
    if(!space || placed.length === 0){
      alert("Add at least one frame to the canvas before exporting.");
      return;
    }
    const rows = computeHangingRows();
    const lines = [HANGING_HEADERS.join(",")];
    rows.forEach(r => lines.push(hangingRowToArray(r).join(",")));
    const csv = lines.join("\n");
    const blob = new Blob([csv], {type: "text/csv"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "hanging-data.csv";
    a.click();
  });

  el("exportPdfBtn").addEventListener("click", () => {
    if(!space || placed.length === 0){
      alert("Add at least one frame to the canvas before exporting.");
      return;
    }
    if(!window.jspdf || !window.jspdf.jsPDF){
      alert("PDF library didn't load — check your internet connection and try again.");
      return;
    }
    generatePdf();
  });

  function hexToRgb(hex){
    hex = (hex || "#000000").replace("#", "");
    if(hex.length === 3) hex = hex.split("").map(c => c+c).join("");
    const num = parseInt(hex, 16);
    return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
  }

  function generatePdf(){
    const { jsPDF } = window.jspdf;
    const orientation = space.w >= space.h ? "landscape" : "portrait";
    const doc = new jsPDF({ unit: "in", format: "letter", orientation });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 0.5;

    // ---- Title ----
    doc.setFontSize(16);
    doc.setTextColor(40, 40, 40);
    doc.text("Picture Layout — Hanging Reference", margin, margin + 0.15);
    doc.setFontSize(10);
    doc.setTextColor(100, 100, 100);
    doc.text(`Space: ${space.w}" wide x ${space.h}" tall`, margin, margin + 0.38);

    // ---- Diagram ----
    const diagramTop = margin + 0.6;
    const diagramAreaW = pageW - margin * 2;
    const diagramAreaH = pageH - diagramTop - margin;
    const scale = Math.min(diagramAreaW / space.w, diagramAreaH / space.h);
    const diagW = space.w * scale;
    const diagH = space.h * scale;
    const diagX = margin + (diagramAreaW - diagW) / 2;
    const diagY = diagramTop;

    // outer space boundary
    doc.setDrawColor(180, 180, 180);
    doc.setLineWidth(0.01);
    doc.rect(diagX, diagY, diagW, diagH);

    placed.forEach((p, idx) => {
      const fx = diagX + (p.x / pxPerInch) * scale;
      const fy = diagY + (p.y / pxPerInch) * scale;
      const fw = p.w * scale;
      const fh = p.h * scale;

      // mat / fill background
      const matW = (p.matWidth || 0) * scale;
      if(p.img){
        try{
          const fmt = p.img.indexOf("image/png") !== -1 ? "PNG" : "JPEG";
          if(matW > 0){
            const [mr, mg, mb] = hexToRgb(p.matColor || "#ffffff");
            doc.setFillColor(mr, mg, mb);
            doc.rect(fx, fy, fw, fh, "F");
          }
          doc.addImage(p.img, fmt, fx + matW, fy + matW, fw - matW*2, fh - matW*2);
        } catch(err){ /* skip image if it can't be embedded */ }
      } else if(matW > 0){
        const [mr, mg, mb] = hexToRgb(p.matColor || "#ffffff");
        doc.setFillColor(mr, mg, mb);
        doc.rect(fx, fy, fw, fh, "F");
      } else {
        doc.setFillColor(242, 240, 236);
        doc.rect(fx, fy, fw, fh, "F");
      }

      // frame border
      const [fr, fg, fb] = hexToRgb(p.color);
      doc.setDrawColor(fr, fg, fb);
      doc.setLineWidth(Math.max(0.01, (p.memberWidth || 1.5) * scale));
      doc.rect(fx, fy, fw, fh);

      // number badge
      const badgeR = 0.14;
      const bx = fx + fw/2, by = fy + badgeR + 0.03;
      doc.setFillColor(20, 20, 20);
      doc.circle(bx, by, badgeR, "F");
      doc.setFontSize(9);
      doc.setTextColor(255, 255, 255);
      doc.text(String(idx+1), bx, by + 0.03, {align: "center"});
    });

    // ---- Data table (new page) ----
    doc.addPage();
    doc.setFontSize(14);
    doc.setTextColor(40, 40, 40);
    doc.text("Hanging Data", margin, margin + 0.1);
    doc.setFontSize(9);
    doc.setTextColor(120, 120, 120);
    doc.text("Import the CSV export into Excel or Google Sheets to adjust for hanger offsets.", margin, margin + 0.3);

    const rows = computeHangingRows().map(hangingRowToArray);
    doc.autoTable({
      head: [HANGING_HEADERS],
      body: rows,
      startY: margin + 0.5,
      margin: {left: margin, right: margin},
      styles: {fontSize: 8},
      headStyles: {fillColor: [61, 90, 128]}
    });

    doc.save("picture-layout-hanging-reference.pdf");
  }

  // ---------- Save / load project ----------
  function saveProjectState(){
    if(!space) return;
    localStorage.setItem(LS_PROJECT, JSON.stringify({space, placed, canvasBgColor}));
  }

  el("saveProjectBtn").addEventListener("click", () => {
    const data = JSON.stringify({space, placed, canvasBgColor}, null, 2);
    const blob = new Blob([data], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "picture-layout.json";
    a.click();
  });

  el("loadProjectBtn").addEventListener("click", () => el("fileLoadInput").click());
  el("fileLoadInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try{
        const data = JSON.parse(ev.target.result);
        space = data.space;
        placed = data.placed || [];
        canvasBgColor = data.canvasBgColor || "#ffffff";
        el("canvasBgColor").value = canvasBgColor;
        el("canvasBgColorHex").value = canvasBgColor;
        setupSpace(space.w, space.h); // recompute scale + show canvas
      } catch(err){
        alert("Couldn't read that file — is it a saved layout JSON?");
      }
    };
    reader.readAsText(file);
  });

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---------- Init ----------
  renderLibrary();
  const savedProject = JSON.parse(localStorage.getItem(LS_PROJECT) || "null");
  if(savedProject && savedProject.space){
    space = savedProject.space;
    placed = savedProject.placed || [];
    canvasBgColor = savedProject.canvasBgColor || "#ffffff";
    el("canvasBgColor").value = canvasBgColor;
    el("canvasBgColorHex").value = canvasBgColor;
    el("spaceW").value = space.w;
    el("spaceH").value = space.h;
    setupSpace(space.w, space.h);
  }
})();
</script>
